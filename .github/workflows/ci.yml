name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify changes and check documentation
        id: scope
        run: python scripts/ci-scope.py

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm install
      - name: Run tests
        run: python -m pytest -q
      - name: Run frontend behavior tests
        run: npm run test:frontend
      - name: Build local app
        run: npm run build
      - name: Build read-only demo
        run: npm run build:demo

  windows-installer:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm install
      - name: Build local app
        run: npm run build
      - name: Run Windows installer contracts
        run: python -m pytest -p no:cacheprovider -q tests/test_windows_installer.py tests/test_library_archives.py
      - name: Run native Windows installer smoke
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows-installer-smoke.ps1

  macos-backup-restore:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run portable backup and restore contracts
        run: python -m pytest -p no:cacheprovider -q tests/test_library_archives.py
