name: Release candidate install update rollback smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact prerelease tag under test (for example, v0.8.1)'
        required: true
        type: string
      baseline_version:
        description: 'Existing release used for update and rollback (for example, v0.8.0)'
        required: true
        default: 'v0.8.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release-contract:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      BASELINE_VERSION: ${{ inputs.baseline_version }}
    steps:
      - name: Checkout exact candidate tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify prerelease identity and public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - "$CANDIDATE_VERSION" "$BASELINE_VERSION" <<'PY'
          import re
          import sys

          pattern = re.compile(r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?")
          matches = []
          for value in sys.argv[1:]:
              match = pattern.fullmatch(value)
              if not match or any(part.isdigit() and len(part) > 1 and part.startswith("0") for part in (match.group(4) or "").split(".") if part):
                  raise SystemExit(f"Release tag is not strict SemVer: {value}")
              matches.append(match)
          if matches[0].group(4):
              raise SystemExit("The promotable candidate must use a bare SemVer tag.")
          if sys.argv[1] == sys.argv[2]:
              raise SystemExit("Candidate and baseline versions must differ.")
          PY
          TAG_SHA="$(git rev-parse "refs/tags/$CANDIDATE_VERSION^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CANDIDATE_VERSION" > "$RUNNER_TEMP/candidate-release.json"
          python - "$RUNNER_TEMP/candidate-release.json" "$CANDIDATE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          version = sys.argv[2]
          expected = {
              f"image-prompt-library-{version}.tar.gz",
              f"image-prompt-library-{version}.tar.gz.sha256",
              f"image-prompt-library-{version}.manifest.json",
          }
          names = [asset.get("name") for asset in release.get("assets") or []]
          if release.get("tag_name") != version or release.get("draft") or not release.get("prerelease"):
              raise SystemExit("Candidate is not the requested published prerelease.")
          if len(names) != 3 or set(names) != expected or len(names) != len(set(names)):
              raise SystemExit(f"Candidate assets are not the exact expected set: {names}")
          PY
          mkdir "$RUNNER_TEMP/candidate-assets"
          gh release download "$CANDIDATE_VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate-assets" \
            --pattern "image-prompt-library-$CANDIDATE_VERSION.tar.gz" \
            --pattern "image-prompt-library-$CANDIDATE_VERSION.tar.gz.sha256" \
            --pattern "image-prompt-library-$CANDIDATE_VERSION.manifest.json"
          unset GH_TOKEN
          python scripts/verify-release-assets.py "$RUNNER_TEMP/candidate-assets" "$CANDIDATE_VERSION" \
            --source-sha "$TAG_SHA" --capability posix-shell-v1

  posix-default-paths:
    needs: release-contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      BASELINE_VERSION: ${{ inputs.baseline_version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install update and rollback at default paths
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          test ! -e "$HOME/.image-prompt-library"
          test ! -e "$HOME/ImagePromptLibrary"
          installer="$RUNNER_TEMP/install-$BASELINE_VERSION.sh"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$BASELINE_VERSION/scripts/install.sh" -o "$installer"
          bash "$installer" --version "$BASELINE_VERSION"
          app="$HOME/.local/bin/image-prompt-library"
          test -x "$app"
          test "$("$app" version)" = "$BASELINE_VERSION"
          printf 'release-smoke\n' > "$HOME/ImagePromptLibrary/release-smoke-sentinel.txt"
          printf '### %s default-path release smoke\n\n- install `%s`: PASS\n' "${{ runner.os }}" "$BASELINE_VERSION" >> "$GITHUB_STEP_SUMMARY"

          "$app" update --version "$CANDIDATE_VERSION"
          test "$("$app" version)" = "$CANDIDATE_VERSION"
          "$app" status
          "$app" doctor
          test "$(cat "$HOME/ImagePromptLibrary/release-smoke-sentinel.txt")" = "release-smoke"
          printf '%s\n' "- update to \`$CANDIDATE_VERSION\`: PASS" >> "$GITHUB_STEP_SUMMARY"

          if "$app" rollback; then
            test "$("$app" version)" = "$BASELINE_VERSION"
            "$app" status
            "$app" doctor
            test "$(cat "$HOME/ImagePromptLibrary/release-smoke-sentinel.txt")" = "release-smoke"
            printf '%s\n' "- rollback to \`$BASELINE_VERSION\`: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' "- rollback to \`$BASELINE_VERSION\`: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  windows-default-paths:
    needs: release-contract
    runs-on: windows-latest
    env:
      CANDIDATE_VERSION: ${{ inputs.version }}
      BASELINE_VERSION: ${{ inputs.baseline_version }}
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install update and rollback at default paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:LOCALAPPDATA "ImagePromptLibrary"
          $library = Join-Path $env:USERPROFILE "ImagePromptLibrary"
          if ((Test-Path -LiteralPath $prefix) -or (Test-Path -LiteralPath $library)) {
              throw "Default Image Prompt Library paths were not clean."
          }
          $installer = Join-Path $env:RUNNER_TEMP "install-$env:BASELINE_VERSION.ps1"
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:BASELINE_VERSION/scripts/install.ps1" -OutFile $installer
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -Version $env:BASELINE_VERSION -NoStart -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "Baseline install failed with exit code $LASTEXITCODE." }

          $app = Join-Path $prefix "bin\image-prompt-library.cmd"
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Installed command shim is missing." }
          function Invoke-App {
              param([string[]]$Arguments)
              $output = @(& $app @Arguments 2>&1)
              if ($LASTEXITCODE -ne 0) { throw (($output | Out-String) + "Exit code: $LASTEXITCODE") }
              $output | Write-Host
              return $output
          }
          $installed = [string]((Invoke-App -Arguments @("version")) | Select-Object -Last 1)
          if ($installed.Trim() -ne $env:BASELINE_VERSION) { throw "Baseline version mismatch: $installed" }
          [IO.File]::WriteAllText((Join-Path $library "release-smoke-sentinel.txt"), "release-smoke`n", [Text.Encoding]::UTF8)
          "### Windows default-path release smoke`n`n- install ``$env:BASELINE_VERSION``: PASS" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          Invoke-App -Arguments @("update", "--version", $env:CANDIDATE_VERSION) | Out-Null
          $updated = [string]((Invoke-App -Arguments @("version")) | Select-Object -Last 1)
          if ($updated.Trim() -ne $env:CANDIDATE_VERSION) { throw "Updated version mismatch: $updated" }
          Invoke-App -Arguments @("status") | Out-Null
          Invoke-App -Arguments @("doctor") | Out-Null
          if ((Get-Content -LiteralPath (Join-Path $library "release-smoke-sentinel.txt") -Raw).Trim() -ne "release-smoke") {
              throw "Private-library sentinel changed during update."
          }
          "- update to ``$env:CANDIDATE_VERSION``: PASS" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          try {
              Invoke-App -Arguments @("rollback") | Out-Null
              $rolledBack = [string]((Invoke-App -Arguments @("version")) | Select-Object -Last 1)
              if ($rolledBack.Trim() -ne $env:BASELINE_VERSION) { throw "Rollback version mismatch: $rolledBack" }
              Invoke-App -Arguments @("status") | Out-Null
              Invoke-App -Arguments @("doctor") | Out-Null
              if ((Get-Content -LiteralPath (Join-Path $library "release-smoke-sentinel.txt") -Raw).Trim() -ne "release-smoke") {
                  throw "Private-library sentinel changed during rollback."
              }
              "- rollback to ``$env:BASELINE_VERSION``: PASS" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } catch {
              "- rollback to ``$env:BASELINE_VERSION``: FAIL" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              throw
          }
