name: Deploy GitHub Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build current read-only demo
        run: npm run build:demo
      - name: Preserve published version routes
        run: |
          redirect='<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/image-prompt-library/"><title>Image Prompt Library</title><a href="/image-prompt-library/">Open the current demo</a>'
          for route in v0.1 v0.2 v0.3 v0.4 v0.6 v0.7; do
            mkdir -p "frontend/dist/$route"
            printf '%s\n' "$redirect" > "frontend/dist/$route/index.html"
          done
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
